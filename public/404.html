<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Drift Operations Manager</title>
  <script type="text/javascript">
    // GitHub Pages is a static host with no server-side rewrites, so a deep
    // link or refresh on any non-root route (e.g. /piloti) 404s here first.
    // Re-encode the path into a query string and redirect to index.html,
    // which decodes it back before the router mounts. Keep 1 path segment
    // (the repo name) since this is a project page, not a user/org page.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
